name: v1.0.8 Release Dispatch

on:
  push:
    branches:
      - "release/v1.0.8-dispatch"

permissions:
  contents: write
  actions: write

jobs:
  create-tag-and-dispatch:
    if: github.repository == 'YYxiaoma/PackBreaker'
    runs-on: ubuntu-24.04
    steps:
      - name: Create immutable v1.0.8 tag and dispatch formal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 4648fbb24420c10f0d41efbc6c8c71a1d49b2a66
          RELEASE_TAG: v1.0.8
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            test "$existing" = "$TARGET_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"               -f ref="refs/tags/$RELEASE_TAG"               -f sha="$TARGET_SHA"
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
          test "$actual" = "$TARGET_SHA"
          gh api --method POST             "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches"             -f ref="$RELEASE_TAG"
          echo "Formal release dispatched for $RELEASE_TAG at $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
