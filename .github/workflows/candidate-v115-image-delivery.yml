name: v1.1.5 Candidate Dual Registry Delivery

# Candidate delivery is restricted to candidate/v1.1.5 pushes or an explicit
# dispatch from main. It waits for SHA-bound CI and Docker E2E before publishing
# immutable test images to GHCR and Docker Hub; it never creates a formal release
# and never advances latest/stable.
on:
  push:
    branches:
      - candidate/v1.1.5
    paths:
      - ".github/workflows/candidate-v115-image-delivery.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/**"
      - "frontend/**"
      - "tests/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "scripts/**"
      - "release-baseline.json"
      - "compose.yaml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Full 40-character SHA of the reviewed v1.1.5 candidate commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packbreaker-candidate-v115-dual-registry-delivery
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
  CANDIDATE_VERSION: 1.1.5
  GHCR_IMAGE: ghcr.io/yyxiaoma/packbreaker
  DOCKERHUB_IMAGE: docker.io/yyxiaoma01/packbreaker

jobs:
  publish-candidate:
    if: github.repository == 'YYxiaoma/PackBreaker' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/candidate/v1.1.5')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
      actions: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Check out candidate/v1.1.5 for source verification
        uses: actions/checkout@v4
        with:
          ref: candidate/v1.1.5
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source identity and version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          test "$(git rev-parse refs/remotes/origin/candidate/v1.1.5)" = "$CANDIDATE_SHA"
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$CANDIDATE_VERSION"
          tag="candidate-v1.1.5-${CANDIDATE_SHA:0:12}"
          echo "CANDIDATE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI "$CANDIDATE_SHA")" >> "$GITHUB_OUTPUT"
      - name: Require verified v1.1.4 immutable upgrade baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.validate_release_baseline import load_release_baseline

          baseline = load_release_baseline()
          assert baseline.version == "1.1.4"
          assert baseline.tag == "v1.1.4"
          assert baseline.commit == "9d63d684de5b04985e480f45b272a308faed29ae"
          assert baseline.image_digest == (
              "sha256:9edb6ebcae21536f4930dc5a8061078b0049efe67af709f450a6b3e97cf03086"
          )
          assert baseline.alembic_revision == "0046_site_user_profile_v114"
          assert baseline.platforms == ("linux/amd64", "linux/arm64")
          PY
      - name: Wait for successful CI and Docker E2E for the exact candidate SHA
        shell: bash
        env:
          CI_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          sha = os.environ["CANDIDATE_SHA"]
          branch = "candidate/v1.1.5"
          workflows = ("ci.yml", "candidate-docker-e2e.yml")
          deadline = time.monotonic() + 3600
          pending = set(workflows)
          while pending:
              for workflow in tuple(sorted(pending)):
                  url = (
                      "https://api.github.com/repos/YYxiaoma/PackBreaker/"
                      f"actions/workflows/{workflow}/runs?head_sha={sha}&event=push&per_page=100"
                  )
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {os.environ['CI_READ_TOKEN']}",
                          "User-Agent": "PackBreaker-v1.1.5-candidate-delivery",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      runs = json.load(response).get("workflow_runs", [])
                  matched = [
                      run for run in runs
                      if run.get("head_sha") == sha
                      and run.get("head_branch") == branch
                      and run.get("event") == "push"
                      and run.get("path", "").endswith("/" + workflow)
                  ]
                  completed = sorted(
                      (run for run in matched if run.get("status") == "completed"),
                      key=lambda run: run.get("run_number", 0),
                      reverse=True,
                  )
                  if completed:
                      latest = completed[0]
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              f"Candidate SHA {sha} has a non-successful {workflow} run: "
                              f"{latest.get('conclusion')}"
                          )
                      print(f"Verified exact candidate {workflow} run {latest['id']}")
                      pending.remove(workflow)
              if pending:
                  if time.monotonic() >= deadline:
                      raise SystemExit(
                          "Timed out waiting for successful exact-SHA workflows: "
                          + ", ".join(sorted(pending))
                      )
                  print("Waiting for exact-SHA CI/E2E: " + ", ".join(sorted(pending)), flush=True)
                  time.sleep(20)
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require Docker Hub candidate credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refuse existing candidate tags in either registry
        shell: bash
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            if docker buildx imagetools inspect "$image:$CANDIDATE_TAG" >/dev/null 2>&1; then
              echo "::error::candidate image already exists and will not be overwritten: $image:$CANDIDATE_TAG"
              exit 1
            fi
          done
      - name: Build and push one multi-arch candidate to both registries
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.identity.outputs.tag }}
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.identity.outputs.tag }}
          build-args: |
            VERSION=${{ env.CANDIDATE_VERSION }}
            VCS_REF=${{ env.CANDIDATE_SHA }}
            BUILD_DATE=${{ steps.identity.outputs.build_date }}
      - name: Verify both candidate tags resolve to the same immutable index
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ghcr_digest="$(docker buildx imagetools inspect "$GHCR_IMAGE:$CANDIDATE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          dockerhub_digest="$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$CANDIDATE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$ghcr_digest" = "$digest"
          test "$dockerhub_digest" = "$digest"
          python3 scripts/verify_release_platforms.py \
            --image "$GHCR_IMAGE@$digest" \
            --tag v1.1.5 \
            --commit "$CANDIDATE_SHA" \
            --multiarch
          bash scripts/check-immutable-image-runtime.sh \
            "$GHCR_IMAGE@$digest" linux/amd64 v1.1.5 "$CANDIDATE_SHA"
          bash scripts/check-immutable-image-runtime.sh \
            "$DOCKERHUB_IMAGE@$digest" linux/amd64 v1.1.5 "$CANDIDATE_SHA"
          echo "GHCR candidate: $GHCR_IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker Hub candidate: $DOCKERHUB_IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"

  native-arm64-candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    needs: publish-candidate
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify native checkout matches requested candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify exact candidate index from both registries on native ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          digest='${{ needs.publish-candidate.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash scripts/check-immutable-image-runtime.sh \
            "$GHCR_IMAGE@$digest" linux/arm64 v1.1.5 "$CANDIDATE_SHA"
          bash scripts/check-immutable-image-runtime.sh \
            "$DOCKERHUB_IMAGE@$digest" linux/arm64 v1.1.5 "$CANDIDATE_SHA"
          echo "Native ARM64 verified both registries at $digest" >> "$GITHUB_STEP_SUMMARY"
