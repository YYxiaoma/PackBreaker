name: Candidate Docker E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "candidate/**"
    paths:
      - ".github/workflows/candidate-docker-e2e.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/app/**"
      - "scripts/check-updater-e2e.sh"
      - "scripts/check-release-upgrade.sh"
      - "scripts/verify_release_platforms.py"
      - "scripts/validate_release_baseline.py"
      - "release-baseline.json"
      - "compose.yaml"

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-e2e:
    name: Compose / updater real Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate published release baseline
        run: python3 scripts/validate_release_baseline.py

      - name: Log in to GHCR for baseline image reads
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Verify actual published AMD64 baseline index, child manifest, and image config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          baseline = json.loads(
              subprocess.check_output(
                  ["python3", "scripts/validate_release_baseline.py", "--json"], text=True
              )
          )["baseline"]
          if baseline["platform"] != "linux/amd64":
              raise SystemExit("expected published AMD64-only baseline")
          subprocess.run(
              [
                  "python3", "scripts/verify_release_platforms.py",
                  "--image", baseline["immutable_image"],
                  "--tag", baseline["tag"], "--commit", baseline["commit"],
              ],
              check=True,
          )
          PY

      - name: Build current main as local candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:candidate-docker-e2e \
            .

      - name: Exercise previous-release upgrade and rollback
        run: bash scripts/check-release-upgrade.sh packbreaker:candidate-docker-e2e

      - name: Exercise real updater, rollback, and Compose-label preservation
        run: bash scripts/check-updater-e2e.sh packbreaker:candidate-docker-e2e
