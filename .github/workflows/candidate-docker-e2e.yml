name: Candidate Docker E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "candidate/**"
    paths:
      - ".github/workflows/candidate-docker-e2e.yml"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "scripts/check-updater-e2e.sh"
      - "scripts/check-release-upgrade.sh"
      - "scripts/check-immutable-image-runtime.sh"
      - "scripts/check_candidate_image_identity.py"
      - "scripts/verify_release_platforms.py"
      - "scripts/validate_release_baseline.py"
      - "release-baseline.json"
      - "compose.yaml"

permissions:
  contents: read
  packages: read

concurrency:
  group: candidate-docker-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  updater-e2e:
    name: Compose / updater real Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate published release baseline
        run: python3 scripts/validate_release_baseline.py

      - name: Log in to GHCR for baseline image reads
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Read-only verify published baseline version tag resolves to immutable digest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t baseline_fields < <(python3 scripts/validate_release_baseline.py --json | python3 -c 'import json,sys; b=json.load(sys.stdin); print(b["image"]); print(b["version"]); print(b["image_digest"])')
          test "${#baseline_fields[@]}" -eq 3
          actual="$(docker buildx imagetools inspect \
            "${baseline_fields[0]}:${baseline_fields[1]}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$actual" = "${baseline_fields[2]}"

      - name: Verify actual published baseline index, child manifests, and image configs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          baseline = json.loads(
              subprocess.check_output(
                  ["python3", "scripts/validate_release_baseline.py", "--json"], text=True
              )
          )
          platform = baseline["platform"]
          if platform not in ("linux/amd64", "multi"):
              raise SystemExit(f"unsupported formal baseline platform: {platform}")
          platform_args = ["--multiarch"] if platform == "multi" else []
          result = subprocess.run(
              [
                  "python3", "scripts/verify_release_platforms.py",
                  "--image", baseline["immutable_image"],
                  "--tag", baseline["tag"], "--commit", baseline["commit"],
                  *platform_args,
              ],
              capture_output=True,
              text=True,
          )
          if result.returncode:
              # GitHub's public job view exposes annotations even when raw
              # step logs are unavailable to anonymous CI observers.
              message = (result.stderr or result.stdout).strip().splitlines()
              print(
                  "::error title=Published baseline platform gate::"
                  + (message[-1] if message else f"exit {result.returncode}"),
                  flush=True,
              )
              result.check_returncode()
          print(result.stdout, end="")
          PY

      - name: Exercise immutable published AMD64 baseline startup in isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t baseline_fields < <(python3 scripts/validate_release_baseline.py --json | python3 -c 'import json,sys; b=json.load(sys.stdin); print(b["immutable_image"]); print(b["tag"]); print(b["commit"])')
          test "${#baseline_fields[@]}" -eq 3
          bash scripts/check-immutable-image-runtime.sh \
            "${baseline_fields[0]}" linux/amd64 "${baseline_fields[1]}" "${baseline_fields[2]}"

      - name: Build current main as local candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:candidate-docker-e2e \
            .

      - name: Verify candidate image identity
        run: |
          python3 scripts/check_candidate_image_identity.py \
            --image packbreaker:candidate-docker-e2e \
            --platform linux/amd64 --commit "$GITHUB_SHA"

      - name: Exercise previous-release upgrade and rollback
        run: bash scripts/check-release-upgrade.sh packbreaker:candidate-docker-e2e

      - name: Exercise real updater, rollback, and Compose-label preservation
        run: bash scripts/check-updater-e2e.sh packbreaker:candidate-docker-e2e
