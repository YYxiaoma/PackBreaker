name: v1.0.9 Docker Hub Readiness

on:
  push:
    branches:
      - "diagnostics/v1.0.9-dockerhub-readiness"

permissions:
  contents: read

jobs:
  dockerhub-readiness:
    if: github.repository == 'YYxiaoma/PackBreaker'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Missing repository secret DOCKERHUB_USERNAME"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing repository secret DOCKERHUB_TOKEN"
            exit 1
          fi
          echo "Docker Hub credentials are configured."

      - name: Authenticate to Docker Hub registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify yyxiaoma/packbreaker repository exists
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error             --output /tmp/dockerhub-repo.json             --write-out '%{http_code}'             --user "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN"             https://hub.docker.com/v2/repositories/yyxiaoma/packbreaker/)"
          case "$code" in
            200)
              echo "Docker Hub repository yyxiaoma/packbreaker exists and is accessible."
              ;;
            404)
              echo "Docker Hub repository yyxiaoma/packbreaker does not exist yet; first authenticated push may create it automatically."
              ;;
            401|403)
              echo "::error::Docker Hub credentials cannot access yyxiaoma/packbreaker (HTTP $code)."
              exit 1
              ;;
            *)
              echo "::error::Unexpected Docker Hub repository probe response: HTTP $code"
              exit 1
              ;;
          esac
