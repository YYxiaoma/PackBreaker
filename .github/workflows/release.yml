name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  arm64-validation:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv and dependencies on native ARM64
        run: |
          python -m pip install "uv==0.12.11"
          uv sync --frozen --all-groups
      - name: Run native ARM64 backend validation
        run: uv run python scripts/ci_pytest.py
      - name: Build and smoke test native ARM64 release candidate
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          docker build --platform linux/arm64 \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:release-arm64-candidate .
          mkdir -p .ci-release-arm64-config .ci-release-arm64-data
          chmod 700 .ci-release-arm64-config
          docker run --detach --name packbreaker-release-arm64 \
            --user "$(id -u):$(id -g)" \
            --publish 18001:8000 \
            --volume "$PWD/.ci-release-arm64-config:/config" \
            --volume "$PWD/.ci-release-arm64-data:/data" \
            packbreaker:release-arm64-candidate
          trap 'docker logs packbreaker-release-arm64 || true; docker rm --force packbreaker-release-arm64 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18001/api/v1/health/ready >/dev/null; then
              break
            fi
            test "$attempt" -ne 60
            sleep 1
          done
          docker exec --user "$(id -u):$(id -g)" packbreaker-release-arm64 \
            python -m backend.app.maintenance preflight
          docker exec --user "$(id -u):$(id -g)" packbreaker-release-arm64 \
            python -c 'import os; from pathlib import Path; src=Path("/data/.packbreaker-arm64-smoke-source"); dest=Path("/data/.packbreaker-arm64-smoke-link"); src.write_bytes(b"synthetic"); os.link(src,dest); assert src.stat().st_ino == dest.stat().st_ino; os.setxattr(dest,"user.packbreaker.arm64_probe",b"ok"); assert os.getxattr(dest,"user.packbreaker.arm64_probe") == b"ok"; dest.unlink(); src.unlink()'
          docker exec --user "$(id -u):$(id -g)" packbreaker-release-arm64 \
            python -m backend.app.maintenance backup

  release:
    runs-on: ubuntu-latest
    needs: arm64-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install uv
        run: python -m pip install "uv==0.12.11"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install project dependencies
        run: |
          uv sync --frozen --all-groups
          corepack pnpm --dir frontend install --frozen-lockfile
      - name: Validate release tag
        run: uv run python scripts/release_manifest.py --tag "$GITHUB_REF_NAME" --validate-tag-only
      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists for $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Require baseline to be the latest published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          baseline_tag="$(python scripts/validate_release_baseline.py --json | python -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$baseline_tag" != "$latest_tag" ]; then
            echo "::error::release baseline $baseline_tag is not latest published release $latest_tag"
            exit 1
          fi
      - name: Run release quality gates
        run: |
          uv run python scripts/check.py
          uv run python scripts/test.py
      - name: Build candidate for previous-release upgrade gate
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:release-candidate \
            .
      - name: Exercise previous-release upgrade and rollback
        run: bash scripts/check-release-upgrade.sh packbreaker:release-candidate
      - name: Exercise real updater helper upgrade and automatic rollback
        run: bash scripts/check-updater-e2e.sh packbreaker:release-candidate
      - name: Prepare immutable image name and build timestamp
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p release
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse an existing immutable version image
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.release_meta.outputs.image }}"
          version="${{ steps.release_meta.outputs.version }}"
          if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
            echo "::error::release image already exists: $image:$version"
            exit 1
          fi
      - name: Build and publish target architecture image index
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: ${{ startsWith(github.ref_name, 'v0.') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.release_meta.outputs.image }}:${{ steps.release_meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.release_meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.release_meta.outputs.created }}
      - name: Verify published immutable digest has exactly the intended platforms
        shell: bash
        run: |
          set -euo pipefail
          platform_args=()
          if [[ "$GITHUB_REF_NAME" != v0.* ]]; then
            platform_args+=(--multiarch)
          fi
          python scripts/verify_release_platforms.py \
            --image "${{ steps.release_meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            "${platform_args[@]}"
      - name: Generate SPDX SBOM from immutable image digest
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ steps.release_meta.outputs.image }}@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: release/packbreaker-${{ steps.release_meta.outputs.version }}.spdx.json
          artifact-name: packbreaker-${{ steps.release_meta.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release manifest and checksums
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/release_manifest.py \
            --tag "$GITHUB_REF_NAME" \
            --image "${{ steps.release_meta.outputs.image }}" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --commit "$GITHUB_SHA" \
            --sbom "release/packbreaker-${{ steps.release_meta.outputs.version }}.spdx.json" \
            --output "release/packbreaker-${{ steps.release_meta.outputs.version }}.release.json" \
            --generated-at "${{ steps.release_meta.outputs.created }}"
          (cd release && sha256sum *.json > SHA256SUMS)
      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: packbreaker-${{ steps.release_meta.outputs.version }}-release-evidence
          path: release/
          if-no-files-found: error
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "PackBreaker $GITHUB_REF_NAME" \
            --generate-notes
      - name: Advance stable and latest channels only after release evidence is published
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ steps.release_meta.outputs.image }}:stable" \
            --tag "${{ steps.release_meta.outputs.image }}:latest" \
            "${{ steps.release_meta.outputs.image }}@${{ steps.build.outputs.digest }}"
