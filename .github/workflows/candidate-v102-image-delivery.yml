name: Candidate Image Delivery

# Restricted candidate-branch push publishes only an isolated test image
# from an exact, previously CI-validated SHA. Never update formal release channels.
on:
  push:
    branches:
      - "candidate/v1.0.2-eight-sites-config"
    paths:
      - ".github/workflows/candidate-v102-image-delivery.yml"

permissions:
  contents: read

concurrency:
  group: packbreaker-candidate-v102-image-delivery
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 0cd1d47da41c6bc97951c80b8bba7dac6d9dd27b
  CANDIDATE_VERSION: 1.0.2
  IMAGE: ghcr.io/yyxiaoma/packbreaker

jobs:
  publish-candidate:
    if: github.repository == 'YYxiaoma/PackBreaker' && github.ref == 'refs/heads/candidate/v1.0.2-eight-sites-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out candidate branch for source verification
        uses: actions/checkout@v4
        with:
          ref: candidate/v1.0.2-eight-sites-config
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source identity and version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/candidate/v1.0.2-eight-sites-config
          git checkout --detach "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$CANDIDATE_VERSION"
          echo "CANDIDATE_TAG=candidate-v1.0.2-${CANDIDATE_SHA:0:12}" >> "$GITHUB_ENV"
          echo "tag=candidate-v1.0.2-${CANDIDATE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git show -s --format=%cI "$CANDIDATE_SHA")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing candidate image
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo '::error::Candidate image already exists; never overwrite a test image tag' >&2
            exit 1
          fi
      - name: Build and push candidate index
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.identity.outputs.tag }}
          build-args: |
            VERSION=${{ env.CANDIDATE_VERSION }}
            VCS_REF=${{ env.CANDIDATE_SHA }}
            BUILD_DATE=${{ steps.identity.outputs.build_date }}
      - name: Verify published candidate image
        shell: bash
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          tag_digest="$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test "$tag_digest" = "$digest"
          python3 scripts/verify_release_platforms.py \
            --image "$IMAGE@$digest" --tag v1.0.2 --commit "$CANDIDATE_SHA" --multiarch
          bash scripts/check-immutable-image-runtime.sh \
            "$IMAGE@$digest" linux/amd64 v1.0.2 "$CANDIDATE_SHA"
          echo "Candidate immutable image: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Architectures verified: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
  native-arm64-candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: publish-candidate
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify native test checkout matches requested candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact published candidate index on native ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          digest='${{ needs.publish-candidate.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bash scripts/check-immutable-image-runtime.sh \
            "$IMAGE@$digest" linux/arm64 v1.0.2 "$CANDIDATE_SHA"
          echo "Native ARM64 candidate verified: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
