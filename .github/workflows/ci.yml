name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==0.12.11"
      - name: Sync Python dependencies
        run: uv sync --frozen --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Static checks and generated-contract drift
        run: uv run python scripts/check.py
      - name: Unit, integration and frontend tests
        run: uv run python scripts/test.py

  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Install bundled Chromium
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser prototype checks
        env:
          PB_BROWSER: bundled
        run: |
          set -euo pipefail
          (cd frontend && corepack pnpm dev) > /tmp/packbreaker-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; cat /tmp/packbreaker-vite.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          (cd frontend && corepack pnpm test:e2e)

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          docker build \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:ci \
            .
      - name: Smoke test image and health endpoint
        run: |
          set -euo pipefail
          mkdir -p .ci-config .ci-data
          docker run --detach \
            --name packbreaker-ci \
            --user "$(id -u):$(id -g)" \
            --publish 18000:8000 \
            --volume "$PWD/.ci-config:/config" \
            --volume "$PWD/.ci-data:/data" \
            packbreaker:ci
          trap 'docker logs packbreaker-ci || true; docker rm --force packbreaker-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<div id="app"></div>'
          test "$(docker image inspect packbreaker:ci --format '{{.Config.User}}')" = "packbreaker"
