name: CI

on:
  push:
    # A candidate branch must receive native ARM64 gates before any release tag.
    branches: [main, "candidate/**"]
  pull_request:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv and Python dependencies on native ARM64
        run: |
          python -m pip install "uv==0.12.11"
          uv sync --frozen --all-groups
      - name: Run backend tests on native ARM64
        run: uv run python scripts/ci_pytest.py
      - name: Exercise ARM64 task journal and simulated downloader business chains
        run: |
          uv run python -m pytest -q \
            tests/application/test_analysis.py \
            tests/application/test_arm64_pre_execution_chain.py \
            tests/application/test_task_linking.py \
            tests/application/test_task_adding.py \
            tests/application/test_downloader_operations.py \
            tests/application/test_transmission_operations.py \
            tests/application/test_filesystem_operations.py \
            tests/application/test_task_repairs.py \
            tests/unit/test_piece_verifier.py \
            tests/unit/test_v2_piece_verifier.py
      - name: Build native ARM64 runtime image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build --platform linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag packbreaker:ci-arm64 .
      - name: Verify candidate image identity
        run: |
          python scripts/check_candidate_image_identity.py \
            --image packbreaker:ci-arm64 \
            --platform linux/arm64 --commit "$GITHUB_SHA"
      - name: Exercise native ARM64 container startup and backup
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sandbox="$(mktemp -d "${TMPDIR:-/tmp}/.packbreaker-arm64-ci.XXXXXXXX")"
          chmod 700 "$sandbox"
          container="packbreaker-ci-arm64-${GITHUB_RUN_ID:-local}-$$-$RANDOM"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            if [[ -d "$sandbox" && ! -L "$sandbox" && \
                  "$(basename "$sandbox")" == .packbreaker-arm64-ci.* && \
                  "$sandbox" != / ]]; then
              rm -rf -- "$sandbox"
            fi
          }
          trap cleanup EXIT
          mkdir -m 700 "$sandbox/config" "$sandbox/data"
          docker run --detach --name "$container" \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" \
            packbreaker:ci-arm64
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec --user "$(id -u):$(id -g)" "$container" \
                python -m backend.app.healthcheck >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [[ "$(docker inspect "$container" --format '{{.State.Running}}')" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo '::error::Native ARM64 CI candidate failed isolated readiness' >&2
            exit 1
          fi
          docker exec --user "$(id -u):$(id -g)" "$container" \
            python -m backend.app.maintenance preflight
          docker exec --user "$(id -u):$(id -g)" "$container" \
            python -c 'import os; from pathlib import Path; src=Path("/data/.packbreaker-arm64-smoke-source"); dest=Path("/data/.packbreaker-arm64-smoke-link"); src.write_bytes(b"synthetic"); os.link(src,dest); assert src.stat().st_ino == dest.stat().st_ino; os.setxattr(dest,"user.packbreaker.arm64_probe",b"ok"); assert os.getxattr(dest,"user.packbreaker.arm64_probe") == b"ok"; dest.unlink(); src.unlink()'
          docker exec --user "$(id -u):$(id -g)" "$container" \
            python -m backend.app.maintenance backup
          docker exec --user "$(id -u):$(id -g)" --interactive "$container" \
            python - --data-root /data < scripts/check_arm64_business_e2e.py
          mapfile -t backups < <(find "$sandbox/config/backups" -maxdepth 1 -type f -name 'packbreaker-*.db' -printf '%f\n')
          test "${#backups[@]}" -eq 1
          backup_name="${backups[0]}"
          docker stop "$container" >/dev/null
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" packbreaker:ci-arm64 \
            python -m backend.app.maintenance verify-backup "/config/backups/$backup_name"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" packbreaker:ci-arm64 \
            python -m backend.app.maintenance restore-backup "/config/backups/$backup_name" \
            --confirm-replace-current-database
          docker start "$container" >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec --user "$(id -u):$(id -g)" "$container" \
                python -m backend.app.healthcheck >/dev/null 2>&1; then
              ready=1
              break
            fi
            if [[ "$(docker inspect "$container" --format '{{.State.Running}}')" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo '::error::Native ARM64 CI candidate failed isolated post-restore readiness' >&2
            exit 1
          fi
      - name: Authenticate for read-only formal baseline image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise immutable formal ARM64 baseline in isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t baseline_fields < <(python scripts/validate_release_baseline.py --json |
            python -c 'import json,sys; b=json.load(sys.stdin); print(b["immutable_image"]); print(b["tag"]); print(b["commit"]); print(b["platform"]); print(",".join(b["platforms"])); print(b["version"])')
          test "${#baseline_fields[@]}" -eq 6
          test "${baseline_fields[3]}" = "multi"
          [[ ",${baseline_fields[4]}," == *",linux/arm64,"* ]]
          test "${baseline_fields[5]}" != "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          bash scripts/check-immutable-image-runtime.sh \
            "${baseline_fields[0]}" linux/arm64 "${baseline_fields[1]}" "${baseline_fields[2]}"
      - name: Exercise native ARM64 formal adjacent upgrade and rollback
        run: bash scripts/check-release-upgrade.sh packbreaker:ci-arm64
      - name: Exercise native ARM64 formal updater and failure rollback
        run: bash scripts/check-updater-e2e.sh packbreaker:ci-arm64
      - name: Exercise isolated native ARM64 qBittorrent and Transmission Docker APIs
        run: bash scripts/check-arm64-real-downloaders-e2e.sh packbreaker:ci-arm64

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository secret and large-file scan
        run: python scripts/repository_scan.py
      - name: Install uv
        run: python -m pip install "uv==0.12.11"
      - name: Sync Python dependencies
        run: uv sync --frozen --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Static checks and generated-contract drift
        run: uv run python scripts/check.py
      - name: Backend unit and integration tests
        run: uv run python scripts/ci_pytest.py
      - name: Frontend unit tests
        working-directory: frontend
        run: corepack pnpm test
      - name: Frontend production build
        working-directory: frontend
        run: corepack pnpm build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv and isolated FastAPI browser fixture dependencies
        run: |
          python -m pip install "uv==0.12.11"
          uv sync --frozen --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Install bundled Chromium
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser prototype checks
        env:
          PB_BROWSER: bundled
        run: |
          set -euo pipefail
          # test:e2e builds production assets and owns the strict-port
          # 127.0.0.1:5173 preview lifecycle. Starting Vite dev here first
          # makes the production browser gate fail or target stale dev assets.
          (cd frontend && corepack pnpm test:e2e)
      - name: Exercise real browser to isolated FastAPI admin approval and Transmission plan
        run: node scripts/check-web-approval-e2e.cjs

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:ci \
            .
      - name: Smoke test image and health endpoint
        run: |
          set -euo pipefail
          sandbox="$(mktemp -d "${TMPDIR:-/tmp}/.packbreaker-amd64-ci.XXXXXXXX")"
          chmod 700 "$sandbox"
          container="packbreaker-ci-${GITHUB_RUN_ID:-local}-$$-$RANDOM"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            if [[ -d "$sandbox" && ! -L "$sandbox" && \
                  "$(basename "$sandbox")" == .packbreaker-amd64-ci.* && \
                  "$sandbox" != / ]]; then
              rm -rf -- "$sandbox"
            fi
          }
          trap cleanup EXIT
          mkdir -m 700 "$sandbox/config" "$sandbox/data"
          docker run --detach \
            --name "$container" \
            --user "$(id -u):$(id -g)" \
            --publish "127.0.0.1:18000:8000" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" \
            packbreaker:ci
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<div id="app"></div>'
          test "$(docker image inspect packbreaker:ci --format '{{.Config.User}}')" = "packbreaker"

          runtime_user="$(id -u):$(id -g)"
          docker exec --user "$runtime_user" "$container" \
            python -m backend.app.maintenance preflight
          docker exec --user "$runtime_user" "$container" \
            python -m backend.app.maintenance backup

          mapfile -t backups < <(find "$sandbox/config/backups" -maxdepth 1 -type f -name 'packbreaker-*.db' -print)
          test "${#backups[@]}" -eq 1
          backup_name="$(basename "${backups[0]}")"

          docker stop "$container" >/dev/null
          docker run --rm --network none \
            --user "$runtime_user" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" \
            packbreaker:ci \
            python -m backend.app.maintenance verify-backup "/config/backups/$backup_name"
          docker run --rm --network none \
            --user "$runtime_user" \
            --volume "$sandbox/config:/config" \
            --volume "$sandbox/data:/data" \
            packbreaker:ci \
            python -m backend.app.maintenance restore-backup "/config/backups/$backup_name" \
            --confirm-replace-current-database

          docker start "$container" >/dev/null
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              exit 1
            fi
            sleep 1
          done

          bash scripts/check-release-upgrade.sh packbreaker:ci

  updater-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build updater candidate image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:updater-e2e \
            .
      - name: Run real Docker updater success and rollback E2E
        run: bash scripts/check-updater-e2e.sh packbreaker:updater-e2e
