name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned uv and Python dependencies on native ARM64
        run: |
          python -m pip install "uv==0.12.11"
          uv sync --frozen --all-groups
      - name: Run backend tests on native ARM64
        run: uv run python scripts/ci_pytest.py
      - name: Exercise ARM64 task journal and simulated downloader business chains
        run: |
          uv run python -m pytest -q \
            tests/application/test_analysis.py \
            tests/application/test_task_linking.py \
            tests/application/test_task_adding.py \
            tests/application/test_downloader_operations.py \
            tests/application/test_transmission_operations.py \
            tests/unit/test_piece_verifier.py \
            tests/unit/test_v2_piece_verifier.py
      - name: Build native ARM64 runtime image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build --platform linux/arm64 \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag packbreaker:ci-arm64 .
      - name: Exercise native ARM64 container startup and backup
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          mkdir -p .ci-arm64-config .ci-arm64-data
          chmod 700 .ci-arm64-config
          docker run --detach --name packbreaker-ci-arm64 \
            --user "$(id -u):$(id -g)" \
            --publish 18001:8000 \
            --volume "$PWD/.ci-arm64-config:/config" \
            --volume "$PWD/.ci-arm64-data:/data" \
            packbreaker:ci-arm64
          trap 'docker logs packbreaker-ci-arm64 || true; docker rm --force packbreaker-ci-arm64 >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18001/api/v1/health/ready >/dev/null; then
              break
            fi
            test "$attempt" -ne 60
            sleep 1
          done
          docker exec --user "$(id -u):$(id -g)" packbreaker-ci-arm64 \
            python -m backend.app.maintenance preflight
          docker exec --user "$(id -u):$(id -g)" packbreaker-ci-arm64 \
            python -c 'import os; from pathlib import Path; src=Path("/data/.packbreaker-arm64-smoke-source"); dest=Path("/data/.packbreaker-arm64-smoke-link"); src.write_bytes(b"synthetic"); os.link(src,dest); assert src.stat().st_ino == dest.stat().st_ino; os.setxattr(dest,"user.packbreaker.arm64_probe",b"ok"); assert os.getxattr(dest,"user.packbreaker.arm64_probe") == b"ok"; dest.unlink(); src.unlink()'
          docker exec --user "$(id -u):$(id -g)" packbreaker-ci-arm64 \
            python -m backend.app.maintenance backup
          docker exec --user "$(id -u):$(id -g)" --interactive packbreaker-ci-arm64 \
            python - --data-root /data < scripts/check_arm64_business_e2e.py
          mapfile -t backups < <(find .ci-arm64-config/backups -maxdepth 1 -type f -name 'packbreaker-*.db' -printf '%f\n')
          test "${#backups[@]}" -eq 1
          backup_name="${backups[0]}"
          docker stop packbreaker-ci-arm64 >/dev/null
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/.ci-arm64-config:/config" \
            --volume "$PWD/.ci-arm64-data:/data" packbreaker:ci-arm64 \
            python -m backend.app.maintenance verify-backup "/config/backups/$backup_name"
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD/.ci-arm64-config:/config" \
            --volume "$PWD/.ci-arm64-data:/data" packbreaker:ci-arm64 \
            python -m backend.app.maintenance restore-backup "/config/backups/$backup_name" \
            --confirm-replace-current-database
          docker start packbreaker-ci-arm64 >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec --user "$(id -u):$(id -g)" packbreaker-ci-arm64 \
              python -m backend.app.healthcheck >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -ne 60
            sleep 1
          done
      - name: Exercise native ARM64 Docker updater and failure rollback with synthetic baseline
        run: bash scripts/check-updater-e2e.sh packbreaker:ci-arm64 --synthetic-arm64-baseline

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository secret and large-file scan
        run: python scripts/repository_scan.py
      - name: Install uv
        run: python -m pip install "uv==0.12.11"
      - name: Sync Python dependencies
        run: uv sync --frozen --all-groups
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Static checks and generated-contract drift
        run: uv run python scripts/check.py
      - name: Backend unit and integration tests
        run: uv run python scripts/ci_pytest.py
      - name: Frontend unit tests
        working-directory: frontend
        run: corepack pnpm test
      - name: Frontend production build
        working-directory: frontend
        run: corepack pnpm build

  browser-e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.34.5
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Install bundled Chromium
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Run browser prototype checks
        env:
          PB_BROWSER: bundled
        run: |
          set -euo pipefail
          (cd frontend && corepack pnpm dev) > /tmp/packbreaker-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; cat /tmp/packbreaker-vite.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          (cd frontend && corepack pnpm test:e2e)

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:ci \
            .
      - name: Smoke test image and health endpoint
        run: |
          set -euo pipefail
          mkdir -p .ci-config .ci-data
          chmod 700 .ci-config
          docker run --detach \
            --name packbreaker-ci \
            --user "$(id -u):$(id -g)" \
            --publish 18000:8000 \
            --volume "$PWD/.ci-config:/config" \
            --volume "$PWD/.ci-data:/data" \
            packbreaker:ci
          trap 'docker logs packbreaker-ci || true; docker rm --force packbreaker-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/ | grep --quiet '<div id="app"></div>'
          test "$(docker image inspect packbreaker:ci --format '{{.Config.User}}')" = "packbreaker"

          runtime_user="$(id -u):$(id -g)"
          docker exec --user "$runtime_user" packbreaker-ci \
            python -m backend.app.maintenance preflight
          docker exec --user "$runtime_user" packbreaker-ci \
            python -m backend.app.maintenance backup

          mapfile -t backups < <(find .ci-config/backups -maxdepth 1 -type f -name 'packbreaker-*.db' -print)
          test "${#backups[@]}" -eq 1
          backup_name="$(basename "${backups[0]}")"

          docker stop packbreaker-ci >/dev/null
          docker run --rm \
            --user "$runtime_user" \
            --volume "$PWD/.ci-config:/config" \
            --volume "$PWD/.ci-data:/data" \
            packbreaker:ci \
            python -m backend.app.maintenance verify-backup "/config/backups/$backup_name"
          docker run --rm \
            --user "$runtime_user" \
            --volume "$PWD/.ci-config:/config" \
            --volume "$PWD/.ci-data:/data" \
            packbreaker:ci \
            python -m backend.app.maintenance restore-backup "/config/backups/$backup_name" \
            --confirm-replace-current-database

          docker start packbreaker-ci >/dev/null
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              exit 1
            fi
            sleep 1
          done

          bash scripts/check-release-upgrade.sh packbreaker:ci

  updater-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build updater candidate image
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          docker build \
            --build-arg VERSION="$version" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag packbreaker:updater-e2e \
            .
      - name: Run real Docker updater success and rollback E2E
        run: bash scripts/check-updater-e2e.sh packbreaker:updater-e2e
