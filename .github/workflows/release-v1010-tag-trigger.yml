name: Dispatch v1.0.10 Release

on:
  push:
    branches:
      - "release/v1.0.10-trigger"

permissions:
  contents: read
  actions: write

concurrency:
  group: packbreaker-v1010-release-dispatch
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: github.repository == 'YYxiaoma/PackBreaker'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trigger branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable tag and dispatch Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: a74ed6c05d84446db5eb842c3ea518395025c1c0
          RELEASE_TAG: v1.0.10
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --force --no-tags
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"

          remote_tag_sha="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$remote_tag_sha" = "$CANDIDATE_SHA"

          gh workflow run release.yml --ref "$RELEASE_TAG"
