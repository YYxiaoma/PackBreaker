services:
  packbreaker:
    build:
      context: .
      target: runtime
    image: "${PACKBREAKER_IMAGE:-packbreaker:local}"
    container_name: packbreaker
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${PACKBREAKER_HTTP_PORT:-8000}:8000"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      PACKBREAKER_TIMEZONE: "${PACKBREAKER_TIMEZONE:-Asia/Shanghai}"
      PACKBREAKER_TRUSTED_PROXIES: "${PACKBREAKER_TRUSTED_PROXIES:-}"
    volumes:
      - packbreaker-config:/config
      - "${PACKBREAKER_DATA_PATH:-./runtime/data}:/data"
      # 可选：需要在 Web 中执行一键升级时取消下一行注释。
      # 挂载 docker.sock 等价于授予容器 Docker 主机级管理权限。
      # - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-m", "backend.app.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  packbreaker-config:
